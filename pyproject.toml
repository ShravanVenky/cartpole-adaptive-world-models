[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-world-model"
version = "1.0.0"
description = "CartPole few-observation adaptation of frozen learned dynamics"
requires-python = ">=3.11"
dependencies = ["torch>=2.11,<2.12", "numpy>=2.3,<2.4", "pandas>=3,<3.1", "matplotlib>=3.10,<3.11"]

[project.scripts]
cartpole-v1 = "adaptive_world_model.experiments.cartpole_v1:main"

[tool.setuptools.packages.find]
where = ["src"]
